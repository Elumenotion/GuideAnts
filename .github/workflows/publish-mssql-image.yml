name: Publish MSSQL Container Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - .github/workflows/publish-mssql-image.yml
      - docker/build/build_webapi_ui.ps1
      - docker/build/webapi-ui/Dockerfile
      - docker/docker-compose.mssql.yml
      - src/client/**
      - src/server/**

concurrency:
  group: publish-mssql-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Build browser UI for Docker
        working-directory: src/client
        run: |
          npm ci
          npm run browser:build:docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/guideants-webapi-ui-mssql
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=GuideAnts Web API UI MSSQL
            org.opencontainers.image.description=GuideAnts API/UI container with embedded SQL Server Express and FTS
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push mssql image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/build/webapi-ui/Dockerfile
          target: runtime-mssql
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
