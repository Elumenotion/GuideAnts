worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        client_max_body_size 50m;

        location = /sandbox {
            return 301 /sandbox/;
        }

        location = /media {
            return 301 /media/;
        }

        location /sandbox/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /sandbox;
        }

        location /media/ {
            proxy_pass http://127.0.0.1:8087/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /media;
        }

        location ~ ^/(llama-cpp|llama-admin|asr|tts|sd|emb)(/.*)?$ {
            default_type application/json;
            return 503 '{"error":"local_model_runtime_unavailable","message":"This guideants-ai slim image provides the Python sandbox and media service only. Use cpu, cuda13, or rocm for local model runtimes."}';
        }
    }
}
