user guideants;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    error_log /dev/stderr warn;
    client_max_body_size 2g;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Keep container logs readable: suppress health checks, UI polling, and
    # high-frequency status probes. Job submits and ComfyUI execution stay visible.
    map $request_uri $loggable {
        default 1;

        ~^/sandbox/health$ 0;

        ~^/api/jobs 0;
        ~^/api/queue 0;
        ~^/api/history 0;
        ~^/api/view 0;
        ~^/assets/ 0;
        ~^/scripts/ 0;
        ~^/extensions/ 0;

        ~^/video/v1/capabilities$ 0;
        ~^/video/health$ 0;
        ~^/video/v1/image/jobs/[0-9a-f]+$ 0;
        ~^/video/v1/talking-head/jobs/[0-9a-f]+$ 0;
    }
    access_log /dev/stdout combined if=$loggable;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        location /sandbox/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /video/ {
            # Job submit/cancel are POST; status/result/capabilities are GET.
            limit_except GET POST { deny all; }
            proxy_pass http://127.0.0.1:8190/;
            proxy_set_header Host $host;
        }

        location = /video/v1/admin/models/install {
            proxy_pass http://127.0.0.1:8190/v1/admin/models/install;
            proxy_pass_request_body on;
            proxy_set_header Host $host;
            proxy_set_header X-Video-Admin-Token $http_x_video_admin_token;
        }

        location ^~ /video/v1/admin/models/install/ {
            proxy_pass http://127.0.0.1:8190/v1/admin/models/install/;
            proxy_set_header Host $host;
            proxy_set_header X-Video-Admin-Token $http_x_video_admin_token;
        }

        location = /comfyui {
            return 301 $scheme://$http_host/;
        }

        location = /comfyui/ {
            return 301 $scheme://$http_host/;
        }

        # ComfyUI listens on loopback :8188. Its frontend uses root-absolute
        # paths (/ws, /scripts, /prompt), so it must be the default location.
        # /video/ and /sandbox/ are longer prefixes and still win.
        location / {
            proxy_pass http://127.0.0.1:8188;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
