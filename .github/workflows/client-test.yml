name: Client and Server tests

on:
  pull_request:
    paths:
      - 'src/client/**'
      - 'src/server/**'
      - '.github/workflows/client-test.yml'
  push:
    branches:
      - main
    paths:
      - 'src/client/**'
      - 'src/server/**'
      - '.github/workflows/client-test.yml'

permissions:
  contents: read
  packages: read

jobs:
  client-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  server-unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore GuideAntsApi.sln

      - name: Run API unit tests
        run: dotnet test GuideAntsApi.Tests/GuideAntsApi.Tests.csproj --configuration Release --verbosity minimal

      - name: Run ScriptExecutionAgent tests
        run: dotnet test ScriptExecutionAgent.Tests/ScriptExecutionAgent.Tests.csproj --configuration Release --verbosity minimal

  server-integration-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Normalize image owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore GuideAntsApi.IntegrationTests/GuideAntsApi.IntegrationTests.csproj

      - name: Run API integration tests
        env:
          GA_INTEGRATION_TEST_MSSQL_IMAGE: ghcr.io/${{ env.OWNER_LC }}/mssql2025-express-fts:latest
        run: dotnet test GuideAntsApi.IntegrationTests/GuideAntsApi.IntegrationTests.csproj --configuration Release --verbosity minimal
