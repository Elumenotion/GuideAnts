name: Package Installer Release Asset

on:
  release:
    types:
      - published

concurrency:
  group: package-installer-release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  package-installer:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Generate release image pins
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          chmod +x installer/scripts/generate-release-image-pins.sh
          ./installer/scripts/generate-release-image-pins.sh "$TAG" "$OWNER_LC" main

      - name: Package installer
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          ASSET="dist/guideants-installer-${TAG}.zip"
          mkdir -p dist

          # Include generated images.env pins; do not use git archive alone.
          (
            cd installer
            zip -r "../$ASSET" . \
              -x '*.git*' \
              -x 'docker/volumes/content-files/*' \
              -x 'docker/volumes/rocm-wsl/*' \
              -x 'docker/volumes/searxng/data/*' \
              -x '.installer_state.env'
          )

          # Ensure the pin file is present in the zip.
          unzip -l "$ASSET" | grep -F 'docker/images.env'

          printf 'TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
          printf 'ASSET=%s\n' "$ASSET" >> "$GITHUB_ENV"

      - name: Verify installer archive
        shell: bash
        run: unzip -t "$ASSET"

      - name: Upload installer release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
