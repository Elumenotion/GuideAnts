name: guideants

services:
  # SQL Server Database
  mssql-express:
    restart: unless-stopped
    image: mssql2025-express-fts
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1' -C -No | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "1434:1433"
    cpus: "4.0"
    volumes:
      - mssql_runtime_state:/var/opt/mssql
      - mssql_data:/var/opt/mssql/data
      - mssql_ftdata:/var/opt/mssql/FTData
      - mssql_log:/var/opt/mssql/log

  # GuideAnts AI: consolidated llama-server + ScriptExecutionAgent
  guideants-ai:
    image: ${GA_AI_CUDA_IMAGE:-ghcr.io/elumenotion/guideants-ai-cuda13:latest}
    container_name: guideants-ai
    cap_drop:
      - SYS_PTRACE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8110:80"      # gateway (/sandbox, /llama-cpp, /asr, /sd, /tts, /emb)
    shm_size: "8gb"
    volumes:
      # Single named volume backs every local AI model (llama GGUFs,
      # Whisper/Qwen ASR, SD bundles, TTS weights, embeddings). Each
      # service reads its own subdir (/models-local/<service>) via its
      # GA_*_MODEL_DIR env var below. Populated by
      # docker/scripts/migrate-local-models-to-single-volume.ps1 before
      # the stack is started for the first time on this host.
      - ai_local_models:/models-local
      - script_agent_admin_state:/var/lib/guideants/script-agent-admin
      - type: bind
        source: ${GA_CONTENT_FILES_HOST_PATH:-./volumes/content-files}
        target: /app/ContentFiles
    environment:
      - FILE_STORAGE_ROOT=/app/ContentFiles
      # Optional global GPU ordering for all guideants-ai workloads.
      # Value is sourced from active environment only.
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-}
      # Optional: host .env HF_TOKEN for docker exec / scripted hf downloads (download-*.ps1). Not used by llama inference.
      - HF_TOKEN=${HF_TOKEN:-}
      - SCRIPT_EXECUTION_AGENT_TOKEN=${GA_SCRIPT_AGENT_TOKEN:-dev-script-agent-token}
      - SCRIPT_EXECUTION_ADMIN_TOKEN=${GA_SCRIPT_AGENT_ADMIN_TOKEN:-dev-script-agent-admin-token}
      - SCRIPT_EXECUTION_ADMIN_STATE_DIR=/var/lib/guideants/script-agent-admin
      - SCRIPT_EXECUTION_SCOPE_STATE_ROOT=/var/lib/guideants/script-agent-admin/scopes
      - SCRIPT_EXECUTION_REQUIRE_TOKEN=true
      - SCRIPT_EXECUTION_ENABLE_IDENTITY_ISOLATION=false
      - SCRIPT_EXECUTION_ALLOW_OWNERSHIP_FALLBACK=true
      # Router aliases live on the named volume (with GGUF trees), not a host bind.
      # GuideAnts API + llama-admin HTTP update this file; optional seed on first boot in entrypoint.sh.
      - GA_LLAMA_MODELS_PRESET=/models-local/router-models.ini
      - GA_LLAMA_MODEL_DIR=/models-local/llama
      - GA_LLAMA_ADMIN_PORT=8086
      - GA_LLAMA_MODELS_MAX=1
      - GA_LLAMA_NO_AUTOLOAD=1
      - GA_LLAMA_CTX_SIZE=262144
      - GA_LLAMA_THREADS=16
      - GA_LLAMA_PARALLEL=5
      - GA_LLAMA_CACHE_RAM=8192
      - GA_LLAMA_GPU_LAYERS=999
      - GA_LLAMA_KV_UNIFIED=1
      - GA_LLAMA_JINJA=1
      - GA_LLAMA_CONT_BATCH=1
      - GA_LLAMA_NO_MMAP=0
      - GA_LLAMA_CUDA_VISIBLE_DEVICES=${GA_LLAMA_CUDA_VISIBLE_DEVICES:-}
      - GA_ASR_HOST=127.0.0.1
      - GA_ASR_PORT=8082
      - GA_ASR_MODEL_DIR=/models-local/asr
      - GA_ASR_DEFAULT_MODEL_PATH=Qwen3-ASR-0.6B
      - GA_ASR_DEFAULT_MODEL_ID=Qwen/Qwen3-ASR-0.6B
      - GA_ASR_WAIT_FOR_READY_ON_STARTUP=${GA_ASR_WAIT_FOR_READY_ON_STARTUP:-0}
      - GA_ASR_READY_TIMEOUT_SECONDS=${GA_ASR_READY_TIMEOUT_SECONDS:-1800}
      - GA_ASR_DEVICE_MAP=auto
      - GA_ASR_BACKEND=cuda
      - GA_ASR_DTYPE=bfloat16
      - GA_ASR_CUDA_VISIBLE_DEVICES=${GA_ASR_CUDA_VISIBLE_DEVICES:-}
      - GA_ASR_MAX_INFERENCE_BATCH_SIZE=8
      - GA_ASR_MAX_NEW_TOKENS=512
      - GA_ASR_WARMUP_ON_LOAD=${GA_ASR_WARMUP_ON_LOAD:-1}
      - GA_ASR_WARMUP_AUDIO_PATH=${GA_ASR_WARMUP_AUDIO_PATH:-/app/asr-service/warmup.webm}
      - GA_ASR_WARMUP_LANGUAGE=${GA_ASR_WARMUP_LANGUAGE:-}
      - GA_TTS_HOST=127.0.0.1
      - GA_TTS_PORT=8084
      - GA_TTS_MODEL_DIR=/models-local/tts
      - GA_TTS_DEFAULT_MODEL_PATH=chatterbox
      - GA_TTS_DEFAULT_MODEL_ID=chatterbox
      - GA_TTS_WAIT_FOR_READY_ON_STARTUP=${GA_TTS_WAIT_FOR_READY_ON_STARTUP:-0}
      - GA_TTS_READY_TIMEOUT_SECONDS=${GA_TTS_READY_TIMEOUT_SECONDS:-1800}
      - GA_TTS_DEVICE_MAP=auto
      - GA_TTS_BACKEND=cuda
      - GA_TTS_DTYPE=float32
      - GA_TTS_CUDA_VISIBLE_DEVICES=${GA_TTS_CUDA_VISIBLE_DEVICES:-}
      - GA_TTS_TIMEOUT_SECONDS=300
      - GA_TTS_MAX_NEW_TOKENS=512
      - GA_TTS_SAMPLE_RATE=24000
      - GA_TTS_VOICE=af_alloy
      - GA_TTS_LANG_CODE=a
      - GA_TTS_SPEED=1.0
      - GA_EMB_HOST=127.0.0.1
      - GA_EMB_PORT=8085
      - GA_EMB_MODEL_DIR=/models-local/emb
      - GA_EMB_DEFAULT_MODEL_PATH=${GA_EMB_DEFAULT_MODEL_PATH}
      - GA_EMB_DEVICE=${GA_EMB_DEVICE:-cuda}
      - GA_EMB_TARGET_DEVICES=${GA_EMB_TARGET_DEVICES:-cuda:0,cuda:1}
      - GA_EMB_CUDA_VISIBLE_DEVICES=${GA_EMB_CUDA_VISIBLE_DEVICES:-}
      - GA_EMB_FIX_MISTRAL_REGEX=${GA_EMB_FIX_MISTRAL_REGEX:-1}
      - GA_EMB_WARMUP_ON_LOAD=${GA_EMB_WARMUP_ON_LOAD}
      - GA_EMB_WAIT_FOR_READY_ON_STARTUP=${GA_EMB_WAIT_FOR_READY_ON_STARTUP:-0}
      - GA_EMB_READY_TIMEOUT_SECONDS=${GA_EMB_READY_TIMEOUT_SECONDS:-1800}
      - GA_MEDIA_HOST=127.0.0.1
      - GA_MEDIA_PORT=8087
      - GA_SD_HOST=127.0.0.1
      - GA_SD_PORT=8083
      - GA_SD_MODEL_DIR=/models-local/sd
      # Diffusion / VAE / text-encoder paths come from the SD service's
      # active bundle (bundles/<id>/{diffusion,vae,text-encoder}/<file>).
      # There is no GA_SD_DIFFUSION_MODEL_PATH / GA_SD_VAE_PATH /
      # GA_SD_LLM_PATH env seam any more — bundle = single source of
      # truth, set via the UI (Settings > Image generation > Set active)
      # or the admin API (PUT /admin/bundles/{id}/active).
      - GA_SD_TIMEOUT_SECONDS=900
      - GA_SD_ENGINE_REQUEST_TIMEOUT_SECONDS=${GA_SD_ENGINE_REQUEST_TIMEOUT_SECONDS:-120}
      - GA_SD_STEPS=4
      - GA_SD_CFG_SCALE=1.0
      - GA_SD_STRENGTH=0.75
      - GA_SD_OFFLOAD_TO_CPU=${GA_SD_OFFLOAD_TO_CPU:-0}
      - GA_SD_DIFFUSION_FA=1
      - GA_SD_WARMUP_PROMPT=${GA_SD_WARMUP_PROMPT:-startup-warmup}
      - GA_SD_WARMUP_SIZE=${GA_SD_WARMUP_SIZE:-512x512}
      - GA_SD_WARMUP_STEPS=${GA_SD_WARMUP_STEPS:-1}
      - GA_SD_WARMUP_OUTPUT_FORMAT=${GA_SD_WARMUP_OUTPUT_FORMAT:-png}
      - GA_SD_WARMUP_REQUEST_TIMEOUT_SECONDS=${GA_SD_WARMUP_REQUEST_TIMEOUT_SECONDS:-180}
      - GA_SD_WARMUP_FAIL_OPEN_ON_STARTUP=${GA_SD_WARMUP_FAIL_OPEN_ON_STARTUP:-1}
      - GA_SD_WAIT_FOR_READY_ON_STARTUP=${GA_SD_WAIT_FOR_READY_ON_STARTUP:-0}
      - GA_SD_READY_TIMEOUT_SECONDS=${GA_SD_READY_TIMEOUT_SECONDS:-1800}
      # Optional SD-only physical GPU pinning. Empty => inherit global
      # CUDA_VISIBLE_DEVICES ordering from this container.
      - GA_SD_CUDA_VISIBLE_DEVICES=${GA_SD_CUDA_VISIBLE_DEVICES:-}
    networks:
      - guideants-network
    restart: unless-stopped


  docling-serve:
    image: ${DOCLING_SERVE_CUDA_IMAGE:-quay.io/docling-project/docling-serve-cu130:v1.21.0}
    container_name: docling-serve
    environment:
      - DOCLING_SERVE_MAX_SYNC_WAIT=${DOCLING_SERVE_MAX_SYNC_WAIT:-600}
      - DOCLING_SERVE_MAX_FILE_SIZE=${DOCLING_SERVE_MAX_FILE_SIZE:-524288000}
      - DOCLING_SERVE_ENG_LOC_NUM_WORKERS=${DOCLING_SERVE_ENG_LOC_NUM_WORKERS:-2}
      - DOCLING_SERVE_ENG_LOC_SHARE_MODELS=${DOCLING_SERVE_ENG_LOC_SHARE_MODELS:-false}
      - DOCLING_NUM_THREADS=${DOCLING_NUM_THREADS:-4}
      - DOCLING_SERVE_LOAD_MODELS_AT_BOOT=${DOCLING_SERVE_LOAD_MODELS_AT_BOOT:-true}
      - DOCLING_SERVE_OPTIONS_CACHE_SIZE=${DOCLING_SERVE_OPTIONS_CACHE_SIZE:-2}
      - DOCLING_SERVE_LOG_LEVEL=${DOCLING_SERVE_LOG_LEVEL:-WARNING}
      - DOCLING_SERVE_LOG_FORMAT=${DOCLING_SERVE_LOG_FORMAT:-text}
      - DOCLING_SERVE_OTEL_ENABLE_METRICS=${DOCLING_SERVE_OTEL_ENABLE_METRICS:-true}
      - DOCLING_SERVE_OTEL_ENABLE_TRACES=${DOCLING_SERVE_OTEL_ENABLE_TRACES:-false}
      - DOCLING_DEBUG_PROFILE_PIPELINE_TIMINGS=${DOCLING_DEBUG_PROFILE_PIPELINE_TIMINGS:-false}
      # Keep document intelligence on the same GPU visibility/order seam.
      - CUDA_VISIBLE_DEVICES=${GA_DOCLING_CUDA_VISIBLE_DEVICES:-${CUDA_VISIBLE_DEVICES:-}}
      - DOCLING_DEVICE=${DOCLING_DEVICE:-cuda}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/version"]
      interval: 30s
      retries: 5
      start_period: 120s
      timeout: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "5001:5001"
    networks:
      guideants-network:
        aliases:
          - docling-serve
    restart: unless-stopped

  documentserver:
    image: ${GA_DOCUMENTSERVER_IMAGE:-documentserver:latest}
    container_name: documentserver
    environment:
      - JWT_ENABLED=${GA_DOCUMENTSERVER_JWT_ENABLED:-false}
      - JWT_SECRET=${DOCUMENTSERVER_JWT_SECRET:-}
      - JWT_HEADER=${GA_DOCUMENTSERVER_JWT_HEADER:-Authorization}
      - JWT_IN_BODY=${GA_DOCUMENTSERVER_JWT_IN_BODY:-false}
      - ALLOW_PRIVATE_IP_ADDRESS=true
    ports:
      - "127.0.0.1:${GA_DOCUMENTSERVER_PORT:-8082}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/info/info.json"]
      interval: 30s
      retries: 5
      start_period: 60s
      timeout: 10s
    networks:
      - guideants-network
    restart: unless-stopped

  # Unified API + browser UI service (single image for web app entrypoint)
  guideants-webapi-ui:
    image: ${GA_WEBAPI_UI_IMAGE:-guideants-webapi-ui:latest}
    container_name: guideants-webapi-ui
    depends_on:
      mssql-express:
        condition: service_healthy
      guideants-ai:
        condition: service_started
    ports:
      - "5107:8080"
    volumes:
      - type: bind
        source: ${GA_CONTENT_FILES_HOST_PATH:-./volumes/content-files}
        target: /app/ContentFiles
    environment:
      - ASPNETCORE_URLS=http://127.0.0.1:8081
      - ASPNETCORE_ENVIRONMENT=Development
      # Idle session window (minutes). Default 30 days; the sliding renewal re-issues
      # the cookie past the halfway point so active sessions never hard-expire.
      - Jwt__LifetimeMinutes=${GA_JWT_LIFETIME_MINUTES:-43200}
      - API_RUNTIME_CONTEXT=compose
      - ConnectionStrings__DefaultConnection=Server=mssql-express,1433;Initial Catalog=${GA_DB_NAME:-guideants-dev};Persist Security Info=False;User ID=sa;Password=YourStrong!Passw0rd;MultipleActiveResultSets=True;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;ConnectRetryCount=3;ConnectRetryInterval=5;
      - FileStorage__Path=/app/ContentFiles
      - Ui__RootPath=/app/ui
      - Ui__DevServerUrl=
      - ALLOWED_ORIGINS=*
      - SearXngSearch__BaseUrl=http://searxng:8080
      - BrowserRendering__BaseUrl=http://searxng:8080
      - LocalServiceHosts__SpeechTranscriptionBaseUrl=http://guideants-ai:80
      - LocalServiceHosts__SpeechSynthesisBaseUrl=http://guideants-ai:80
      - LocalServiceHosts__ImageGenerationBaseUrl=http://guideants-ai:80
      - LocalServiceHosts__EmbeddingsBaseUrl=http://guideants-ai:80
      - LocalServiceHosts__MediaBaseUrl=http://guideants-ai:80
      - LocalServiceHosts__DocumentIntelligenceBaseUrl=http://docling-serve:5001
      - DocumentServer__Enabled=${GA_DOCUMENTSERVER_ENABLED:-false}
      - DocumentServer__InternalUrl=http://documentserver
      - DocumentServer__ApiBaseUrl=http://guideants-webapi-ui:8080
      - DocumentServer__JwtEnabled=${GA_DOCUMENTSERVER_JWT_ENABLED:-false}
      - DocumentServer__JwtSecret=${DOCUMENTSERVER_JWT_SECRET:-}
      - DocumentServer__JwtHeader=${GA_DOCUMENTSERVER_JWT_HEADER:-Authorization}
      - DocumentServer__JwtInBody=${GA_DOCUMENTSERVER_JWT_IN_BODY:-false}
      - ScriptExecution__AgentToken=${GA_SCRIPT_AGENT_TOKEN:-dev-script-agent-token}
      - ScriptExecution__AdminToken=${GA_SCRIPT_AGENT_ADMIN_TOKEN:-dev-script-agent-admin-token}

      - LlamaCpp__BaseUrl=http://guideants-ai:80/llama-cpp
      - ServiceRouting__Containers__guideants-ai__BaseUrl=http://guideants-ai:80/sandbox
      - ServiceRouting__Containers__plantuml__BaseUrl=http://plantuml:80
      # Optional: HF CLI/scripts and Hugging Face downloads can read HF_TOKEN. Prefer storing the token in
      # Settings → Providers → Llama.cpp (Hugging Face token, DB-backed) for in-app downloads.
      - HF_TOKEN=${HF_TOKEN:-}
      - SettingsSecrets__ActiveKeyId=local-dev
      - SettingsSecrets__Keys__local-dev=MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=
      - Logging__LogLevel__GuideAntsApi.Services.Components.SpeechTranscriptionService=Information
      - Logging__LogLevel__GuideAntsApi.Services.Components.SpeechSynthesisService=Information
    networks:
      - guideants-network
      - default
    restart: unless-stopped

  # PlantUML service
  plantuml:
    image: plantuml-1.2025.2
    container_name: plantuml
    environment:
      - FILE_STORAGE_ROOT=/app/ContentFiles
      - SCRIPT_EXECUTION_AGENT_TOKEN=${GA_SCRIPT_AGENT_TOKEN:-dev-script-agent-token}
      - SCRIPT_EXECUTION_REQUIRE_TOKEN=true
      - PLANTUML_LIMIT_SIZE=8192
      - SCRIPT_EXECUTION_ENABLE_IDENTITY_ISOLATION=false
      - SCRIPT_EXECUTION_ALLOW_OWNERSHIP_FALLBACK=true
    ports:
      - "8111:80"
    volumes:
      - type: bind
        source: ${GA_CONTENT_FILES_HOST_PATH:-./volumes/content-files}
        target: /app/ContentFiles
    networks:
      - guideants-network
    restart: unless-stopped

  searxng:
    container_name: readweb-searxng
    image: ${GA_SEARXNG_IMAGE:-guideants-searxng:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - type: bind
        source: ${GA_SEARXNG_CONFIG_HOST_PATH:-./volumes/searxng/config}
        target: /etc/searxng
      - type: bind
        source: ${GA_SEARXNG_DATA_HOST_PATH:-./volumes/searxng/data}
        target: /var/cache/searxng
    environment:
      - FORCE_OWNERSHIP=true
      - BROWSER_RENDER_PORT=3001
    networks:
      - guideants-network

volumes:
  mssql_runtime_state:
  mssql_data:
  mssql_ftdata:
  mssql_log:
  ai_local_models:

  script_agent_admin_state:

networks:
  guideants-network:
    driver: bridge

