name: Publish PlantUML Image

on:
  workflow_dispatch:

concurrency:
  group: publish-plantuml-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish ScriptExecutionAgent
        run: dotnet publish src/server/ScriptExecutionAgent/ScriptExecutionAgent.csproj -c Release -o ./artifacts/ScriptExecutionAgent

      - name: Stage PlantUML build context artifacts
        shell: bash
        run: |
          rm -rf docker/build/Sandboxes/PlantUml/ScriptExecutionAgent
          mkdir -p docker/build/Sandboxes/PlantUml/ScriptExecutionAgent
          cp -R ./artifacts/ScriptExecutionAgent/. docker/build/Sandboxes/PlantUml/ScriptExecutionAgent/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/guideants-plantuml
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=GuideAnts PlantUML
            org.opencontainers.image.description=GuideAnts PlantUML container with ScriptExecutionAgent
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push PlantUML image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/build/Sandboxes/PlantUml
          file: ./docker/build/Sandboxes/PlantUml/dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=guideants-plantuml
          cache-to: type=gha,mode=max,scope=guideants-plantuml
